<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่ SDGs | ปิดกิจกรรม</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', 'Prompt', sans-serif; overflow: hidden; }
        
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        /* --- Animations --- */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.7)); transform: scale(1.05); }
        }

        .animate-slide-up {
            animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .animate-float {
            animation: floatAnim 4s ease-in-out infinite;
        }
        .animate-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }
        
        /* ของตกแต่งพื้นหลัง */
        .floating-particle {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.4;
            animation: floatAnim 5s ease-in-out infinite;
            z-index: 0;
            filter: grayscale(20%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-gray-100 p-4">

    <div class="absolute inset-0 bg-gradient-to-br from-blue-100 via-white to-purple-100 z-0"></div>

    <div class="floating-particle" style="top: 15%; left: 15%; animation-delay: 0s;">🌍</div>
    <div class="floating-particle" style="top: 25%; right: 20%; animation-delay: 1.5s;">♻️</div>
    <div class="floating-particle" style="bottom: 20%; left: 25%; animation-delay: 3s;">🌱</div>
    <div class="floating-particle" style="bottom: 30%; right: 15%; animation-delay: 0.8s;">💡</div>

    <div class="relative z-10 w-full max-w-md glass-panel rounded-3xl p-8 md:p-10 text-center animate-slide-up">
        
        <div class="animate-float mb-6 inline-block">
            <div class="text-7xl animate-glow">✨🙏✨</div>
        </div>
        
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-4 font-prompt drop-shadow-sm">
            กิจกรรมสิ้นสุดลงแล้ว
        </h1>
        
        <div class="w-16 h-1 bg-gradient-to-r from-blue-400 to-purple-400 mx-auto rounded-full mb-6"></div>

        <p class="text-gray-600 text-base md:text-lg mb-8 font-medium leading-relaxed font-prompt">
            ขอขอบคุณทุกท่านที่ให้ความสนใจ<br>
            และร่วมสนุกกับ <span class="text-blue-600 font-bold">"เกมจับคู่ SDGs"</span><br>
            ไว้พบกันใหม่ในกิจกรรมหน้านะครับ 💙
        </p>

        <a href="https://lookerstudio.google.com/s/qbmD9gZI_TM" target="_blank"
           class="inline-flex w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 px-6 rounded-2xl transition-all duration-300 transform hover:scale-105 shadow-xl items-center justify-center space-x-2 text-lg no-underline font-prompt">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <span>ดูสรุปคะแนนรวมทั้งหมด</span>
        </a>

    </div>

</body>
</html>
